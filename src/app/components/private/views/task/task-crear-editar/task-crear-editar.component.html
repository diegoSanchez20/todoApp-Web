<div class="container mt-5">
  <div class="row justify-content-center"> 
    <div class="col-md-4">
      <h3 class="text-center mb-4">
        {{ item == undefined ? 'Crear' : 'Editar' }} Tareas
      </h3>
      <form [formGroup]="taskForm" (ngSubmit)="onClick.guardar()">
        <div class="mb-3">
          <label class="form-label"> Título</label>
          <input
            class="form-control"
            formControlName="title"
            placeholder="Ingrese el título"
          >
          <div
            class="text-danger mt-1"
            *ngIf="
              taskForm.get('title')?.touched &&
              taskForm.get('title')?.invalid
            "
          >
            {{ errorMessages.titulo }}
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">
            Descripción
          </label>
          <input
            class="form-control"
            formControlName="description"
            placeholder="Ingrese la descripción"
          >
          <div
            class="text-danger mt-1"
            *ngIf="
              taskForm.get('description')?.touched &&
              taskForm.get('description')?.invalid
            "
          >
            {{ errorMessages.descripcion }}
          </div>
        </div>
        <!-- Botón -->
        <button
          type="submit"
          class="btn btn-primary w-100"
        >
          Guardar
        </button>
      </form>
    </div>
  </div>
</div>
