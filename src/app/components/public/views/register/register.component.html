<div class="container mt-5">
  <div class="row justify-content-center"> 
    <div class="col-md-4">
      <h3 class="text-center mb-4">
        Registrar
      </h3>
      <form [formGroup]="registerForm" (ngSubmit)="onClick.register()">
        <div class="mb-3">
          <label class="form-label"> Nombres Completos</label>
          <input
            class="form-control"
            formControlName="name"
            placeholder="Ingrese sus nombres Completos"
            maxlength="255"
          >
          <div
            class="text-danger"
            *ngIf="registerForm.get('name')?.touched && registerForm.get('name')?.invalid"
          >
            Ingrese sus nombres completos
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label"> Email</label>
          <input
            type="email"
            class="form-control"
            formControlName="email"
            placeholder="Ingrese su email",
            maxlength="255"
          >
          <div
            class="text-danger"
            *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.invalid"
          >
            {{ emailErrorMsg }}
          </div>
        </div>

        <!-- Password -->
        <div class="mb-3">
          <label class="form-label">
            Contraseña
          </label>
          <input
            type="password"
            class="form-control"
            formControlName="password"
            placeholder="Ingrese su contraseña"
            maxlength="255"
          >
          <div
            class="text-danger"
            *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.invalid"
          >
            {{ passwordErrorMsg }}
          </div>
        </div>
        <!-- Botón -->
        <button
          type="submit"
          class="btn btn-primary w-100"
        >
          Registrar
        </button>
      </form>
      <button
        type="button"
        (click)="onClick.irLogin()"
        class="btn btn-link d-block mx-auto mt-2"
      >
        ¿Ya tienes una cuenta? Haz clic aquí
      </button>
    </div>
  </div>
</div>
